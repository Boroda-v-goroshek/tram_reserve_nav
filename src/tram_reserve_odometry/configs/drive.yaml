# Модель тягового привода и продольной динамики по ручке контроллера + паспорт 71-911ЕМ.
# u_d(t) = u(t - tau);  a_мод = theta_T*f+(u_d, v) + theta_B*f-(u_d, v) - w(v,s)*tanh(v/0.2) - k_g*g*i(s) + b;
# w(v,s) = w0 + c_aero*v^2 + k_curve*min(|kappa(s)|, 1/r_min). Связь с паспортом — docs/physical_model.md
# (раздел «Паспорт в уравнениях»).
# da/dt = (a_мод - a) / T + w.  f(u, v) — таблица drv_table_file; i(s) — уклон карты.
# Идентификация (офлайн) — в шапке maps/drive_map.csv.
reserve_odometry:
  ros__parameters:
    drive:
      drv_table_file: ""       # пусто = share/.../maps/drive_map.csv
      drv_tau: 0.225           # запаздывание привода, с (идентификация по датасету)
      drv_T: 0.1375            # инерция привода, с (идентификация по датасету)
      drv_w0: 0.046            # основное сопротивление движению, м/с² (≈ 5 Н/кН — типично для трамвая)
      drv_c_aero: 1.3e-4       # аэродинамика rho*c_x*A/(2*m_eq): A = 2.5 × 3.4 м, c_x 0.8, m_eq 30 т, 1/м
      drv_k_curve: 4.0         # сопротивление в кривых w = k/R, м²/с² (≈ mu*(колея + база тележки)/2*g)
      drv_r_min: 18.0          # радиус кривой не меньше (шум кривизны карты), м
      drv_power_extrap: true   # тяга выше 16 м/с — по постоянной мощности 4 × 72 кВт: f·v = const
      drv_kg: 0.779            # коэффициент уклона
      drv_q_jerk: 1.0          # шум рывка в режиме модели (ошибка модели), м²/с⁵
      drv_q_theta: 1.0e-3      # шум множителей тяги/торможения, 1/√с
      drv_sigma_theta0: 0.15   # начальная неопределённость множителей (масса, загрузка)
      drv_q_b: 0.01            # шум возмущения, м/с²/√с
      drv_sigma_b0: 0.1        # начальная неопределённость возмущения, м/с²
      drv_theta_min: 0.8       # границы множителей = m_ref/m: масса 24.6 (тара) … 35.1 т (150 пасс.),
      drv_theta_max: 1.25      # m_ref ≈ 28–30 т по полке мощности таблицы
      drv_v_hold: 0.1          # ниже — стоянка: торможение не тянет назад, м/с
      drv_monitor: true        # монитор валидности модели (автоведение: ручка не отражает тягу)
      drv_mon_win: 3.0         # окно монитора валидности модели, с
      drv_mon_on: 0.35         # RMS невязки ускорения выше — модель не объясняет движение, м/с²
      drv_mon_off: 0.2         # RMS невязки без среднего ниже — снова объясняет, м/с²
      drv_substep: 0.02        # шаг интегрирования прогноза, с
      drv_outage_s: 0.5        # тележки молчат дольше — счисление по модели, с
