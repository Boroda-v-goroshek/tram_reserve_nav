# Фильтр скорости KalmanWheelEstimator в режиме «модель привода» + физические пределы
# и детектор проскальзывания по паспорту (docs/physical_model.md).
# Модель — include/tram_reserve_odometry/plugins/kalman_wheel_estimator.hpp.
reserve_odometry:
  ros__parameters:
    estimator:
      kf_drive_model: true     # прогноз по модели привода вместо кинематики
      kf_r: 0.03               # шум тележки, м/с
      kf_q_jerk: 1.0           # плотность шума рывка, м²/с⁵
      kf_tau_a: 1.5            # время корреляции ускорения, с (кинематика)
      kf_sensor_delay: 0.0     # задержка датчика тележки, с
      kf_gate_sigma: 5.0       # гейт невязки, сигм
      kf_gate_min: 0.5         # гейт невязки не меньше, м/с
      kf_zero: 0.05            # «ноль» тележки, м/с
      kf_dead_other: 1.0       # другая тележка быстрее -> ноль считается отказом, м/с
      kf_disagree_abs: 0.5     # допуск расхождения тележек, м/с ...
      kf_disagree_rel: 0.05    # ... плюс доля скорости
      kf_resync_s: 1.0         # без принятых измерений дольше -> ресинхронизация, с
      kf_max_horizon: 0.3      # предел прогноза к метке публикации, с
      kf_robust: true          # правила отбраковки
      kf_extrapolate: true     # прогноз к метке публикации
      kf_zupt: true            # ZUPT на стоянке
      kf_v_max: 25.0           # образец тележки быстрее — не скорость кузова, м/с (75 км/ч = 20.8 + запас на боксование)
      kf_slip_asym: false      # правило 2 по режиму: в тяге отбрасывается опережающая тележка, в торможении — отстающая
      kf_slip_low: 0.02        # относительное скольжение для статуса LOW (критический крип сухого рельса ~1.5–2 %)
      kf_slip_high: 0.05       # ... MEDIUM (крип мокрого/заснеженного рельса 3–8 %)
